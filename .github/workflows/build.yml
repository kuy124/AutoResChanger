name: Build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            make

      - name: Build with MinGW-w64
        run: |
          windres resource.rc -O coff -o resource.res
          g++ -O2 -s -Wall -Wextra -Wpedantic \
              -Wno-unknown-pragmas -Wno-missing-field-initializers \
              main.cpp resource.res -o AutoResChanger.exe \
              -mwindows -municode \
              -luser32 -lgdi32 -lshell32 -lcomdlg32 -ladvapi32 \
              -ldwmapi -luxtheme -lole32 -lcomctl32

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: AutoResChanger
          path: AutoResChanger.exe
          if-no-files-found: error

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: AutoResChanger.exe
